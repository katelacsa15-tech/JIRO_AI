<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIRO AI</title>
    <link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JIRO AI">
</head>
    <body>

    <div class="app">
        <header class="header">
            <h2>JIRO AI</h2>
            <button id="newChat">New chat</button>
        </header>

        <main class="chat-area" id="chatArea">
            <div class="welcome">
                <h1>JIRO AI</h1>
                <p>How can I help you today?</p>
            </div>
        </main>

        <footer class="input-area">
            <form id="chatForm">
    <label for="imageInput" class="attach-button">+</label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >

    <input
        type="text"
        id="userInput"
        placeholder="Message JIRO AI..."
        autocomplete="off"
    >

    <button type="submit" id="sendButton">↑</button>
</form>

            <p>JIRO AI can make mistakes. Check important information.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
